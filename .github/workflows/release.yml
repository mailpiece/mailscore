# Tag a release, attach the built gem and publish the container image. The gem is not published
# to RubyGems: callers pin a commit. Run this workflow manually on main after bumping the version
# and pushing, once CI has passed on that commit: CI gates the image, and the release builds and
# publishes it for linux/amd64 and linux/arm64, signed and with its provenance attested.
name: Release
on:
  workflow_dispatch:
permissions: {}

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mailpiece/mailscore
  IMAGE_DESCRIPTION: A boring spam scorer for mail servers.
  SOURCE_URL: https://github.com/${{ github.repository }}

jobs:
  gem:
    name: Test and build the gem
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read   # required to find the CI run for this commit
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Install only what the lockfile names, and fail if the Gemfile has drifted from it.
    env:
      BUNDLE_FROZEN: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No bundler cache: a release is built from gems fetched fresh, never
      # from a cache another run could have written.
      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
      - name: Read the version and refuse one already released
        id: version
        run: |
          VERSION=$(ruby -e "require './lib/mailscore/version'; puts MailScore::VERSION")
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "v${VERSION} is already released; bump the version first"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Refuse a commit CI has not passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "CI has not passed on ${GITHUB_SHA}; wait for it or fix it first"
            exit 1
          fi
      - name: Install gems
        run: bundle install
      - name: Audit dependencies
        run: bundle exec bundle-audit check --update
      - name: Run tests
        run: bundle exec rake
      - name: Build gem
        run: bundle exec rake build
      - name: Keep the gem for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gem
          path: pkg/mailscore-*.gem
          if-no-files-found: error

  build:
    name: Build and push image (${{ matrix.arch }})
    needs: gem
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write   # required to push the image by digest
      id-token: write   # required to attest the image's provenance
      attestations: write   # required to attest the image's provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Ruby version
        id: ruby
        run: echo "version=$(cat .ruby-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.gem.outputs.version }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ env.SOURCE_URL }}

      - name: Build and push by digest (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            RUBY_VERSION=${{ steps.ruby.outputs.version }}
          platforms: ${{ matrix.platform }}
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          sbom: false
          provenance: false

      - name: Attest image provenance (per-arch)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Create multi-arch manifest and sign
    needs: [gem, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: write   # required to tag the image and push its signature
      id-token: write   # required to sign and attest the image keylessly
      attestations: write   # required to attest the image's provenance
    env:
      VERSION: ${{ needs.gem.outputs.version }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx (for imagetools)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.gem.outputs.version }}
            type=raw,value=latest
          flavor: |
            latest=false

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("--tag " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation "index:org.opencontainers.image.description=${IMAGE_DESCRIPTION}" \
            $(printf "${image}@sha256:%s " *)

      - name: Inspect image
        id: manifest
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          digest=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Cosign sign the manifest (keyless OIDC)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Attest image provenance (manifest)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: false

  release:
    name: Tag a GitHub release
    needs: [gem, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # required to push the release tag
    env:
      VERSION: ${{ needs.gem.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the gem
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Write the release notes
        run: |
          awk -v ver="$VERSION" '
            $0 == "## " ver { keep = 1 }
            keep && /^## / && $0 != "## " ver { keep = 0 }
            keep { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo
            echo "Image: \`${REGISTRY}/${IMAGE_NAME}:${VERSION}\`, for linux/amd64 and linux/arm64."
          } >> release-notes.md
      - name: Create GitHub Release # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.gem.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            assets/mailscore-*.gem
          body_path: release-notes.md
          generate_release_notes: false
