name: CI

on: push

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint-actions:
    name: GitHub Actions audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The gem author's fix for fasttext building for the runner's own CPU;
      # cache-version drops bundles built before it.
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        env:
          BUNDLE_BUILD__FASTTEXT: "--with-optflags="
        with:
          bundler-cache: true
          cache-version: 1
      - name: Audit dependencies
        run: bundle exec bundle-audit check --update
      - name: Run tests
        run: bundle exec rake

  # The image as deployed: read-only with a tmpfs /tmp and /data on a volume,
  # so a write anywhere else fails here rather than in production.
  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --pull --tag mailscore:ci .
      # The image's own health check, run every two seconds rather than every
      # thirty so the job need not wait for it.
      - name: Boot it read-only and wait for it to report healthy
        run: |
          docker run --detach --name mailscore --read-only --tmpfs /tmp \
            --env MAILSCORE_READ_TOKEN=ci-token-00000000000000000000000 --publish 8080:8080 --health-interval 2s mailscore:ci
          for _ in $(seq 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' mailscore)"
            [ "$status" = healthy ] && break
            sleep 1
          done
          docker logs mailscore
          [ "$status" = healthy ] || { echo "the container is $status"; exit 1; }
      - name: Answer pong and report the database healthy
        run: |
          [ "$(curl --silent --fail http://127.0.0.1:8080/ping)" = pong ]
          curl --silent --fail --header "Authorization: Bearer ci-token-00000000000000000000000" http://127.0.0.1:8080/health | grep --quiet '"status":"ok"'
      - name: Assert the image carries no setuid or setgid binaries
        run: |
          # As root, so the traversal reads every directory.
          gadgets="$(docker run --rm --user 0 --entrypoint sh mailscore:ci -c 'find / -xdev -type f -perm /06000')"
          if [ -n "$gadgets" ]; then
            echo "the image ships setuid or setgid binaries:"
            echo "$gadgets"
            exit 1
          fi
      # Only what a rebuild can fix: a fixable High or Critical means the base
      # has fallen behind a patch, which --pull above picks up.
      - name: Scan the image for fixable High and Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mailscore:ci
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore.yaml
      # Left without .trivyignore.yaml, so the bill of materials records the image as it is.
      - name: Generate a CycloneDX SBOM of the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mailscore:ci
          scan-type: image
          format: cyclonedx
          output: mailscore.cdx.json
      - name: Publish the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mailscore-sbom
          path: mailscore.cdx.json
